<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create account | Women Safety</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-page">
    <header class="auth-header"><h1>Women Safety</h1></header>
    <main class="auth-card">
        <h2>Create your account</h2>
        <p>Your emergency contacts are saved with your account.</p>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}<p class="flash-message {{ category }}">{{ message }}</p>{% endfor %}
        {% endwith %}
        <form class="auth-form" method="post">
            <label for="name">Full name</label>
            <input id="name" name="name" required autocomplete="name">
            <label for="email">Email address</label>
            <input id="email" type="email" name="email" required autocomplete="email">
            <label for="mobile_number">Mobile number</label>
            <input id="mobile_number" type="tel" name="mobile_number" required autocomplete="tel">
            <label>Emergency contacts</label>
            <div id="contact-fields">
                <div class="contact-row">
                    <input name="contact_name[]" placeholder="Contact name" required>
                    <input type="tel" name="contact_number[]" placeholder="Mobile number" required>
                </div>
            </div>
            <button class="add-contact" type="button" id="add-contact">+ Add another contact</button>
            <label for="password">Password</label>
            <input id="password" type="password" name="password" minlength="8" required autocomplete="new-password">
            <label for="confirm_password">Confirm password</label>
            <input id="confirm_password" type="password" name="confirm_password" minlength="8" required autocomplete="new-password">
            <button class="auth-submit" type="submit">Create account</button>
        </form>
        <p class="auth-links">Already registered? <a href="{{ url_for('login') }}">Log in</a></p>
    </main>
    <script src="{{ url_for('static', filename='auth.js') }}"></script>
</body>
</html>
